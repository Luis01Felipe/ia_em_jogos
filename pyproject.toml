[project]
name = "ia-em-jogos"
version = "1.0.0"
description = "Inteligência em jogo: diferentes IAs, diferentes formas de vencer (códigos da palestra)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pygame>=2.5",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RET"]

[tool.ruff.lint.flake8-bugbear]
# Configurações imutáveis (dataclasses congeladas) podem ser valores padrão de argumentos.
extend-immutable-calls = [
    "arena.flappy.world.FlappyConfig",
    "arena.shared.genetic.EvolutionConfig",
    "arena.snake.qlearning.QLearningConfig",
    "arena.pong.game.PongConfig",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
